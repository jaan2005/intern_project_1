# Runs the databases we need locally: MongoDB (app data) and Redis (BullMQ queue, later)
services:
  mongo:
    image: mongo:7
    container_name: lms-mongo
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7
    container_name: lms-redis
    ports: ["6379:6379"]
volumes:
  mongo_data:
