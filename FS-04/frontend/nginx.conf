server {
  listen 80;
  client_max_body_size 10m;               # attachments are limited to 5 MB by the API
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri /index.html; }   # React Router: any other URL serves the app
}
