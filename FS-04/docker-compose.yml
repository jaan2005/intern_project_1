# Runs the whole platform:   docker compose up --build        then open http://localhost:8080
# First time:                cp .env.example .env   (and set DJANGO_SECRET_KEY)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:                    # Django REST API (runs migrations on start)
    build: ./backend
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.example to .env and set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: db
      POSTGRES_DB: pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      MEDIA_ROOT: /app/media
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes: [media:/app/media]       # attachments and reports; the worker writes reports, the API serves them
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:                     # Celery: webhook delivery, notification emails, reports
    build: ./backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    environment: *backend-env
    volumes: [media:/app/media]
    depends_on:
      backend: {condition: service_healthy}

  frontend:                   # React app served by nginx, which forwards /api to the backend
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
  media:
